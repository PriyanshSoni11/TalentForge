<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Assessment &middot; TalentForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF9F5] text-[#173428] min-h-screen">
  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-8">
      <a href="/" aria-label="TalentForge home"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt="TalentForge" class="h-9 w-auto" /></a>
      <button id="skip" class="text-sm text-green-700 underline">Skip for now</button>
    </div>
    <section class="bg-white border border-green-100 rounded-2xl p-6 md:p-8">
      <p class="text-xs font-semibold uppercase tracking-wide text-green-600">Student onboarding</p>
      <h1 class="text-3xl font-bold mt-2">Validate your skills</h1>
      <p class="text-green-700 mt-2">Answer 20 questions based on the skills found in your resume. You can skip now, but assessment completion is required before applying.</p>
      <div id="progress" class="h-2 bg-green-100 rounded-full mt-6"><div id="progress-bar" class="h-2 bg-green-700 rounded-full" style="width:0%"></div></div>
      <p id="status" class="text-sm text-green-600 mt-3">Loading your assessment...</p>
      <form id="assessment-form" class="space-y-6 mt-6"></form>
      <button id="submit" class="hidden w-full bg-green-700 text-white py-3 rounded-lg font-medium hover:bg-green-800">Submit assessment</button>
      <div id="result" class="hidden mt-6 rounded-xl bg-green-50 border border-green-200 p-5"></div>
    </section>
  </main>
  <script>
    const token = localStorage.getItem("access_token");
    const headers = { Authorization: `Bearer ${token}` };
    const form = document.getElementById("assessment-form");
    const submit = document.getElementById("submit");
    const status = document.getElementById("status");
    let assessmentId;
    let questions = [];

    function goDashboard() { window.location.href = "/dashboard/student"; }
    document.getElementById("skip").addEventListener("click", goDashboard);

    async function loadAssessment() {
      if (!token) { window.location.href = "/student/login"; return; }
      const response = await fetch("/api/students/assessment/start", { method: "POST", headers });
      const data = await response.json();
      if (!response.ok) {
        if (response.status === 409) { goDashboard(); return; }
        status.textContent = data.error || "Could not load assessment.";
        return;
      }
      assessmentId = data.assessment_id;
      questions = data.questions || [];
      status.textContent = `${questions.length} questions from your resume skills`;
      form.innerHTML = questions.map((question, index) => `
        <fieldset class="border-b border-green-100 pb-5">
          <legend class="font-semibold">${index + 1}. ${question.question}</legend>
          <p class="text-xs text-green-600 mt-1 mb-3">Skill: ${question.skill_tag}</p>
          <div class="space-y-2">${question.options.map((option, optionIndex) => `
            <label class="flex gap-3 items-start border border-green-100 rounded-lg p-3 cursor-pointer hover:bg-green-50">
              <input required type="radio" name="question-${question.id}" value="${optionIndex}" class="mt-1" />
              <span>${option}</span>
            </label>`).join("")}</div>
        </fieldset>`).join("");
      submit.classList.remove("hidden");
      updateProgress();
      form.addEventListener("change", updateProgress);
    }
    function updateProgress() {
      const answered = form.querySelectorAll("input:checked").length;
      document.getElementById("progress-bar").style.width = `${questions.length ? answered / questions.length * 100 : 0}%`;
    }
    submit.addEventListener("click", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const answers = {};
      questions.forEach(question => { answers[question.id] = Number(form.querySelector(`input[name="question-${question.id}"]:checked`).value); });
      const response = await fetch(`/api/students/assessment/${assessmentId}/submit`, {
        method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify({ answers })
      });
      const data = await response.json();
      if (!response.ok) { status.textContent = data.error || "Could not submit assessment."; return; }
      submit.classList.add("hidden");
      document.getElementById("skip").classList.add("hidden");
      document.getElementById("result").innerHTML = `<h2 class="text-xl font-bold">Assessment complete</h2><p class="mt-2">Your score: <strong>${data.score_pct}%</strong></p><p class="text-sm mt-2">Your validated skills are now used to match you with opportunities.</p><button id="continue" class="mt-4 bg-green-700 text-white px-4 py-2 rounded-lg">Continue to dashboard</button>`;
      document.getElementById("result").classList.remove("hidden");
      document.getElementById("continue").addEventListener("click", goDashboard);
    });
    loadAssessment().catch(() => { status.textContent = "Network error, please try again."; });
  </script>
</body>
</html>
